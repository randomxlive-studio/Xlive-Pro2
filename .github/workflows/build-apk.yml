name: Build RandomXLive APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK 36.1 & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "$SDK_ROOT/licenses" "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" "$SDK_ROOT/platform-tools" "$SDK_ROOT/cmdline-tools"
          sudo chmod 777 "$SDK_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT/licenses" "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" "$SDK_ROOT/platform-tools" "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          rm -rf /tmp/bootstrap-cmdtools
          if [ -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            mv "$SDK_ROOT/cmdline-tools/latest" /tmp/bootstrap-cmdtools
          else
            EXISTING_CMD=$(ls -1d "$SDK_ROOT"/cmdline-tools/* 2>/dev/null | head -n 1 || true)
            if [ -n "$EXISTING_CMD" ] && [ -x "$EXISTING_CMD/bin/sdkmanager" ]; then
              cp -r "$EXISTING_CMD" /tmp/bootstrap-cmdtools
            else
              curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
              unzip -q /tmp/cmdtools.zip -d /tmp
              mv /tmp/cmdline-tools /tmp/bootstrap-cmdtools
            fi
          fi
          chmod +x /tmp/bootstrap-cmdtools/bin/sdkmanager

          set +o pipefail
          yes | /tmp/bootstrap-cmdtools/bin/sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          /tmp/bootstrap-cmdtools/bin/sdkmanager --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1"

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          sudo mkdir -p /opt/gradle-dist
          sudo unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt/gradle-dist
          echo "/opt/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /opt/gradle-dist/gradle-9.3.1/bin/gradle --version

      - name: Build Debug APK
        run: |
          set -o pipefail
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          /opt/gradle-dist/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee gradle-build.log
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" RandomXLive.apk
          ls -lh RandomXLive.apk

      - name: Print Build Error Summary on Failure
        if: failure()
        run: |
          echo "### ❌ ملخص خطأ البناء (Build Failure Log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f gradle-build.log ]; then
            tail -n 80 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed before Gradle step — check failed step above." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-apk RandomXLive.apk --clobber --repo "${{ github.repository }}"
            gh release edit latest-apk --latest --repo "${{ github.repository }}"
          else
            gh release create latest-apk RandomXLive.apk \
              --target "${{ github.sha }}" \
              --title "RandomXLive APK" \
              --notes "Direct APK download from latest commit" \
              --latest \
              --repo "${{ github.repository }}"
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RandomXLive-APK
          path: RandomXLive.apk
          if-no-files-found: error
          retention-days: 90
