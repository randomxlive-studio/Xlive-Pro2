name: Build RandomXLive APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "$SDK_ROOT"
          sudo chmod -R a+rwx "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "$SDKMANAGER"

          mkdir -p "$SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "build-tools;36.0.0" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" || true
          sudo chmod -R a+rwx "$SDK_ROOT"

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          sudo mkdir -p /opt/gradle-dist
          sudo unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt/gradle-dist
          echo "/opt/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /opt/gradle-dist/gradle-9.3.1/bin/gradle --version

      - name: Build Debug APK
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" RandomXLive.apk
          ls -lh RandomXLive.apk

      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-apk RandomXLive.apk --clobber --repo "${{ github.repository }}"
            gh release edit latest-apk --latest --repo "${{ github.repository }}"
          else
            gh release create latest-apk RandomXLive.apk \
              --target "${{ github.sha }}" \
              --title "RandomXLive APK" \
              --notes "Direct APK download from latest commit" \
              --latest \
              --repo "${{ github.repository }}"
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RandomXLive-APK
          path: RandomXLive.apk
          if-no-files-found: error
          retention-days: 90
